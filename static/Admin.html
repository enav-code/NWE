<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <h3>ADMIN</h3>
            <button onclick="goBack()">Back</button>
            <button onclick="goOperations()">Operations</button>
            <button onclick="loadUsers()">Refresh</button>
            <input id="search" placeholder="Search..." oninput="filterUsers()">
        </div>

        <div class="main">
            <div class="topbar">
                <h2>Admin Dashboard</h2>
                <div class="admin-panel-buttons">
                    <button onclick="loadStats()">Load Stats</button>
                    <button onclick="loadLogs()">Load Logs</button>
                    <button onclick="loadSessions()">Load Sessions</button>
                </div>
            </div>

            <section class="panel">
                <h3>Statistics</h3>
                <div id="stats" class="stats-display"></div>
            </section>

            <section class="panel">
                <h3>Audit Logs</h3>
                <div id="logs" class="logs-display"></div>
                <div class="pager" id="logsPager">
                    <button onclick="logsPrev()">Prev</button>
                    <span id="logsPageInfo"></span>
                    <button onclick="logsNext()">Next</button>
                </div>
            </section>

            <section class="panel">
                <h3>Create User</h3>
                <div class="form-row">
                    <input id="newUsername" placeholder="Username">
                    <input id="newPassword" type="password" placeholder="Password">
                    <select id="newRole">
                        <option value="viewer">Viewer</option>
                        <option value="admin">Admin</option>
                        <option value="operator">Operator</option>
                        <option value="moderator">Moderator</option>
                        <option value="support">Support</option>
                        <option value="readonly_admin">Readonly Admin</option>
                    </select>
                    <button onclick="createUser()">Create</button>
                </div>
                <div id="createMsg" class="message"></div>
            </section>

            <section class="panel">
                <h3>Active Sessions</h3>
                <div id="sessions" class="sessions-display"></div>
            </section>

            <section class="panel">
                <h3>User Management</h3>
                <button onclick="bulkDelete()">Delete Selected Users</button>
                <div id="users" class="grid"></div>
                <div class="pager" id="usersPager">
                    <button onclick="usersPrev()">Prev</button>
                    <span id="usersPageInfo"></span>
                    <button onclick="usersNext()">Next</button>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/js/shared.js"></script>
    <script src="/static/js/admin.js"></script>
    <script src="/static/js/operations.js"></script>
    <script>
        (async () => {
            await loadCSRF();
            await initAdmin();
        })();
    </script>
</body>
</html>
